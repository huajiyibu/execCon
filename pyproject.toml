[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "execcon-v2"
version = "0.1.0"
description = "Execution-grounded convergence experiment harness"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
remote = ["httpx>=0.27", "simple-agentic-evals>=0.19.2"]

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
